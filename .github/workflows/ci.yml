name: ci

# Definition of done для любой стратегии: собирается и не ломает инварианты.
# Преподаватель на практике показывает эту проверку вместо «ну у меня на машине работает».

on:
  push:
    branches: [main, "strategy/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 + Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Maven ставим явно: на свежих ubuntu-раннера его может не быть в образе,
          # и тогда шаг падает за секунды со «mvn: command not found»
          maven-version: "3.9"
          cache: maven

      - name: версия инструментов
        run: mvn -v && java -version

      # основные проверки лабы: инварианты по всем стратегиям.
      # failIfNoSpecifiedTests=false обязательно: -am тянет exchange-core, где таких тестов нет,
      # и без этого флага surefire падает с «No tests matching pattern»
      - name: тесты стратегий (EngineInvariantTest)
        run: mvn -B -pl exchange-server -am -Dtest=EngineInvariantTest
             -Dsurefire.failIfNoSpecifiedTests=false test

      # стоимость замков без HTTP: артефакт можно приложить к отчёту
      - name: микро-бенчмарк стратегий
        run: mvn -B -pl exchange-server -am -Dtest=ReadWriteMicroBenchmarkTest
             -Dsurefire.failIfNoSpecifiedTests=false test

      - name: полная сборка всех модулей
        run: mvn -B -DskipTests package

      - name: харнес умеет прогнать стратегии в своей JVM
        run: java -jar lab-harness/target/lab-harness-1.0.0.jar --ops=15 --seller-ops=5
             --only=none,sync,trylock,locks,rw,optimistic,queue --csv=out/ci.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results
          path: |
            out/ci.csv
            exchange-server/target/micro-bench.txt
          if-no-files-found: warn
